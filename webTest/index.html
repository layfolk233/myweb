<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 合集 · 首页导览</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    /* ========== 首页特有样式 ========== */
    .hero {
      text-align: center;
      padding: 80px 24px 40px;
      position: relative;
    }
    .hero__badge {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(224,122,95,0.1);
      color: var(--color-primary);
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 24px;
    }
    .hero__title {
      font-size: 3rem;
      font-weight: 800;
      color: var(--color-secondary);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .hero__title span {
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero__desc {
      font-size: 1.15rem;
      color: var(--color-text-light);
      max-width: 520px;
      margin: 0 auto 40px;
      line-height: 1.7;
    }

    /* 卡片网格 */
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto 80px;
      padding: 0 24px;
    }
    .demo-card {
      background: var(--color-card);
      border-radius: var(--radius-xl);
      padding: 36px 28px 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
      text-decoration: none;
      color: var(--color-text);
      transition: all 0.4s var(--ease-out-expo);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .demo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      border-radius: 4px 4px 0 0;
      transition: height 0.3s var(--ease-out-expo);
    }
    .demo-card:nth-child(1)::before { background: var(--color-primary); }
    .demo-card:nth-child(2)::before { background: var(--color-accent); }
    .demo-card:nth-child(3)::before { background: var(--color-nav-bg); }

    .demo-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
    }
    .demo-card:hover::before { height: 6px; }
    .demo-card__icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      display: block;
      transition: transform 0.4s var(--ease-spring);
    }
    .demo-card:hover .demo-card__icon {
      transform: scale(1.15) rotate(-5deg);
    }
    .demo-card__title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--color-secondary);
      margin-bottom: 8px;
    }
    .demo-card__desc {
      font-size: 0.95rem;
      color: var(--color-text-light);
      line-height: 1.6;
      flex: 1;
    }
    .demo-card__arrow {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-primary);
      transition: gap 0.3s var(--ease-out-expo);
    }
    .demo-card:hover .demo-card__arrow { gap: 12px; }

    /* 装饰 */
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-border), transparent);
    }
    @media (max-width: 640px) {
      .hero__title { font-size: 2rem; }
      .hero { padding: 50px 16px 30px; }
      .demo-grid { grid-template-columns: 1fr; padding: 0 16px; }
    }
  </style>
</head>
<body data-nav-current="index">

  <!-- ========== Hero ========== -->
  <section class="hero">
    <div class="hero__badge">✨ Frontend Demo Collection</div>
    <h1 class="hero__title">创意 <span>Demo</span> 合集</h1>
    <p class="hero__desc">
      三个精心设计的前端演示页面，从数据展示到互动留言，再到趣味猫咪互动——每一页都充满细节与温度。
    </p>
  </section>

  <!-- ========== 卡片导航 ========== -->
  <div class="demo-grid">

    <!-- 页面一：网站橱窗 -->
    <a href="demo1.html" class="demo-card fade-in" style="animation-delay: 0.1s">
      <span class="demo-card__icon">🪟</span>
      <h2 class="demo-card__title">网站橱窗</h2>
      <p class="demo-card__desc">
        以精美卡片展示收藏的网站，每个网站配有 Logo、描述与标签。数据源自本地 JSON 文件，可随时增删改。
      </p>
      <span class="demo-card__arrow">去看看 →</span>
    </a>

    <!-- 页面二：留言广场 -->
    <a href="demo2.html" class="demo-card fade-in" style="animation-delay: 0.2s">
      <span class="demo-card__icon">💬</span>
      <h2 class="demo-card__title">留言广场</h2>
      <p class="demo-card__desc">
        在这里留下你的足迹——文字、图片皆可。数据自动保存到浏览器本地，也可一键导出为 JSON 文件。
      </p>
      <span class="demo-card__arrow">去看看 →</span>
    </a>

    <!-- 页面三：猫咪乐园 -->
    <a href="demo3.html" class="demo-card fade-in" style="animation-delay: 0.3s">
      <span class="demo-card__icon">🐱</span>
      <h2 class="demo-card__title">猫咪乐园</h2>
      <p class="demo-card__desc">
        一只活泼的橘猫在温馨房间里等你。用鼠标和它互动——抚摸、玩耍，看它如何回应你的每一个动作。
      </p>
      <span class="demo-card__arrow">去看看 →</span>
    </a>

  </div>

  <!-- ========== 导航组件 ========== -->
  <script src="js/nav.js"></script>
</body>
</html>
